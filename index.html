<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#272f8a">
<title>ERP Quatar</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app" hidden>
  <aside class="rail">
    <div class="brand"><img src="logo.png" alt="Quatar Crop Science"><small>ERP Quatar</small></div>
    <nav class="nav" id="nav"></nav>
  </aside>
  <main class="main">
    <div class="top">
      <div><div class="crumb" id="crumb"></div><h1 id="title">ERP</h1></div>
      <div class="who">
        <span class="me" id="me"></span>
        <button class="btn sm" id="chpw">Đổi mật khẩu</button>
        <button class="btn sm" id="logout">Đăng xuất</button>
      </div>
    </div>
    <nav class="subtabs" id="subtabs" aria-label="Phân hệ của bộ phận"></nav>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div class="login" id="login"><form class="lbox" id="lform" autocomplete="on">
 <img src="logo.png" alt="Quatar Crop Science">
 <h2 id="l-title">Đăng nhập ERP</h2>
 <div id="l-step1">
  <div class="field"><label for="l-u">Tên đăng nhập</label><input id="l-u" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="vd: hung.nvkd"></div>
  <div class="field"><label for="l-p">Mật khẩu</label><input id="l-p" type="password" autocomplete="current-password"></div>
 </div>
 <div id="l-step2" hidden>
  <p class="note">Lần đầu đăng nhập (hoặc vừa được đặt lại mật khẩu): đặt mật khẩu mới của riêng bạn, tối thiểu 8 ký tự.</p>
  <div class="field"><label for="l-n1">Mật khẩu mới</label><input id="l-n1" type="password" autocomplete="new-password"></div>
  <div class="field"><label for="l-n2">Nhập lại mật khẩu mới</label><input id="l-n2" type="password" autocomplete="new-password"></div>
 </div>
 <div class="err" id="l-err" role="alert"></div>
 <button class="btn pri" style="width:100%" id="l-go">Đăng nhập</button>
 <p class="note" style="margin:14px 0 0">Tài khoản do Admin cấp, không tự đăng ký. Quên mật khẩu: liên hệ Admin để đặt lại.</p>
</form></div>

<div class="drawer" id="drawer"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>
<script type="module" src="app.js"></script>
</body>
</html>
